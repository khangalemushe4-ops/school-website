<body>
<section id="notifications">
  <h2>Stay Updated</h2>
  <p>We’ll keep you informed about your bookings, payments, and car wash status. Choose how you’d like to receive notifications.</p>
  
  <form>
    <label>
      <input type="checkbox" name="notify_booking" checked>
      Booking Confirmations
    </label><br><br>
    
    <label>
      <input type="checkbox" name="notify_payment" checked>
      Payment Receipts
    </label><br><br>
    
    <label>
      <input type="checkbox" name="notify_reminder">
      Service Reminders
    </label><br><br>
    
    <label>
      <input type="checkbox" name="notify_completion">
      Completion Alerts
    </label><br><br>
    
    <label>Preferred Notification Method:
      <select name="method" required>
        <option value="email">Email</option>
        <option value="sms">SMS</option>
        <option value="both">Both</option>
      </select>
    </label><br><br>
    
    <button class="btn" type="submit"><a href="Update Preferences.HTML">Update Preferences</a></button>
  </form>
</section>

  </div>
</footer>

</body>
</html>
