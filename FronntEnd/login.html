<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AutoClean360</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <main class="container">
    <h2>Log in</h2>
    <div id="msg"></div>
    <form id="login-form">
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button class="btn" type="submit">Log in</button>
      <p class="muted mt-2">New here? <a href="signup.html">Create an account</a></p>
    </form>
  </main>
  <footer><p>&copy; 2026 AutoClean360</p></footer>

  <script src="auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.innerHTML = '';
      const f = e.target;
      try {
        const { user, token } = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: f.email.value.trim(), password: f.password.value }),
        });
        Auth.save(token, user);
        // Fetch is_admin flag from /api/auth/me so admin link shows
        const me = await api('/api/auth/me');
        Auth.save(token, me);
        const next = new URLSearchParams(location.search).get('next');
        location.href = next || 'home.html';
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
