<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments — AutoClean360</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <main class="container">
    <h2>Your Payments</h2>
    <p class="muted">Pay online using our mock gateway (swap for Yoco/PayFast later).</p>
    <div id="msg"></div>
    <div id="list"></div>
  </main>
  <footer><p>&copy; 2026 AutoClean360</p></footer>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    const listEl = document.getElementById('list');
    const msg = document.getElementById('msg');

    async function load() {
      try {
        const bookings = await api('/api/bookings');
        if (!bookings.length) { listEl.innerHTML = '<p class="muted">No bookings yet.</p>'; return; }
        listEl.innerHTML = `
          <table>
            <thead><tr><th>Date</th><th>Service</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>${bookings.map(b => `
              <tr>
                <td>${b.booking_date?.slice(0,10)} ${b.booking_time}</td>
                <td>${b.service.name}</td>
                <td>R${Number(b.payment?.amount || b.service.price).toFixed(2)}</td>
                <td><span class="pill pill-${b.payment?.status || 'unpaid'}">${b.payment?.status || 'unpaid'}</span></td>
                <td>
                  ${b.payment?.status === 'paid'
                    ? '<span class="muted">Paid</span>'
                    : `<button class="btn btn-sm" data-pay="${b.id}">Pay Now</button>`}
                </td>
              </tr>`).join('')}
            </tbody>
          </table>`;
      } catch (err) {
        listEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    listEl.addEventListener('click', async (e) => {
      const id = e.target.dataset.pay;
      if (!id) return;
      if (!confirm('Pay R amount for this booking now?')) return;
      try {
        await api('/api/payments/booking/' + id + '/pay', { method: 'POST' });
        msg.innerHTML = '<div class="alert alert-success">Payment recorded.</div>';
        load();
      } catch (err) { msg.innerHTML = `<div class="alert alert-error">${err.message}</div>`; }
    });

    load();
  </script>
</body>
</html>
