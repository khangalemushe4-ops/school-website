<section id="payments">
  <h2>Secure Online Payments</h2>
  <p>Complete your booking payment safely using our trusted payment gateway.</p>
  
  <form>
    <label>Cardholder Name:
      <input type="text" name="card_name" required>
    </label><br><br>
    
    <label>Card Number:
      <input type="text" name="card_number" maxlength="16" required>
    </label><br><br>
    
    <label>Expiry Date:
      <input type="month" name="expiry" required>
    </label><br><br>
    
    <label>CVV:
      <input type="password" name="cvv" maxlength="3" required>
    </label><br><br>
    
    <label>Billing Address:
      <input type="text" name="address" required>
    </label><br><br>
    
    <button class="btn" type="submit">Pay Now</button>
  </form>
</section>
