<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — AutoClean360</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <main class="container">
    <h2>Contact Us</h2>
    <p class="muted">79 Sarel Cilliers, Pretoria North · 013 758 5456 · info@AutoClean360.co.za</p>
    <div id="msg"></div>

    <form id="contact-form" class="card" style="max-width:520px;">
      <label>Full Name
        <input type="text" name="name" required maxlength="100">
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Phone
        <input type="tel" name="phone" maxlength="30">
      </label>
      <label>Message
        <textarea name="message" required maxlength="2000"></textarea>
      </label>
      <button class="btn" type="submit">Send Message</button>
    </form>
  </main>
  <footer><p>&copy; 2026 AutoClean360</p></footer>

  <script src="auth.js"></script>
  <script>
    const msg = document.getElementById('msg');
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const f = e.target;
      try {
        await api('/api/contact', {
          method: 'POST',
          body: JSON.stringify({
            name: f.name.value.trim(),
            email: f.email.value.trim(),
            phone: f.phone.value.trim() || undefined,
            message: f.message.value.trim(),
          }),
        });
        msg.innerHTML = '<div class="alert alert-success">Message sent — we\'ll be in touch.</div>';
        f.reset();
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
