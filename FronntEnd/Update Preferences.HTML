<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Preferences</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="HOME.HTML">HOME</a>
  </nav>
<section id="preferences">
  <h2>Update Your Preferences</h2>
  <form>
    <label>
      Notification Method:
      <select name="notify_method">
        <option value="email">Email</option>
        <option value="sms">SMS</option>
        <option value="both">Both</option>
      </select>
    </label><br><br>

    <label>
      Default Vehicle:
      <select name="vehicle">
        <option value="toyota">Toyota Corolla - ABC123</option>
        <option value="ford">Ford Ranger - XYZ789</option>
      </select>
    </label><br><br>

    <label>
      Preferred Service:
      <select name="service">
        <option value="standard">Standard Wash</option>
        <option value="deluxe">Deluxe Wash</option>
        <option value="interior">Interior Cleaning</option>
        <option value="detailing">Full Detailing</option>
      </select>
    </label><br><br>

    
  </form>
</section>

 <footer>
  <div class="footer-bottom" style="text-align:center; padding:15px; background:#005fa3; color:white;">
    <p>&copy; 2026 AutoClean360. All rights reserved. | support@autoclean360.com</p>
  </div>
</footer>


</body>
</html>
