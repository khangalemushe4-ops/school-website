<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Vehicles — AutoClean360</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <main class="container">
    <h2>My Vehicles</h2>
    <div id="msg"></div>

    <form id="vehicle-form" class="card" style="max-width:520px;">
      <h3 id="form-title">Add a vehicle</h3>
      <input type="hidden" name="id">
      <label>Make &amp; Model
        <input type="text" name="make_model" required maxlength="100">
      </label>
      <label>Year
        <input type="number" name="year" min="1900" max="2100">
      </label>
      <label>Registration Number
        <input type="text" name="reg_number" required maxlength="20">
      </label>
      <label>Color
        <input type="text" name="color" maxlength="30">
      </label>
      <label>Preferred Service (optional)
        <input type="text" name="preferred_service" maxlength="100">
      </label>
      <button class="btn" type="submit">Save Vehicle</button>
      <button class="btn btn-secondary" type="button" id="cancel-edit" style="display:none;">Cancel</button>
    </form>

    <h3 class="mt-2">Saved Vehicles</h3>
    <div id="vehicles"></div>
  </main>
  <footer><p>&copy; 2026 AutoClean360</p></footer>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    const form = document.getElementById('vehicle-form');
    const listEl = document.getElementById('vehicles');
    const msg = document.getElementById('msg');
    const cancelBtn = document.getElementById('cancel-edit');
    const title = document.getElementById('form-title');

    function resetForm() {
      form.reset();
      form.id.value = '';
      title.textContent = 'Add a vehicle';
      cancelBtn.style.display = 'none';
    }

    async function load() {
      try {
        const rows = await api('/api/vehicles');
        if (!rows.length) { listEl.innerHTML = '<p class="muted">No vehicles yet.</p>'; return; }
        listEl.innerHTML = `
          <table>
            <thead><tr><th>Make &amp; Model</th><th>Year</th><th>Reg</th><th>Color</th><th>Service</th><th>Actions</th></tr></thead>
            <tbody>${rows.map(v => `
              <tr>
                <td>${v.make_model}</td>
                <td>${v.year ?? '—'}</td>
                <td>${v.reg_number}</td>
                <td>${v.color ?? '—'}</td>
                <td>${v.preferred_service ?? '—'}</td>
                <td>
                  <button class="btn btn-sm" data-edit='${JSON.stringify(v).replace(/'/g, "&#39;")}'>Edit</button>
                  <button class="btn btn-sm btn-danger" data-del="${v.id}">Delete</button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>`;
      } catch (err) {
        listEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const body = {
        make_model: form.make_model.value.trim(),
        year: form.year.value ? Number(form.year.value) : undefined,
        reg_number: form.reg_number.value.trim(),
        color: form.color.value.trim() || undefined,
        preferred_service: form.preferred_service.value.trim() || undefined,
      };
      try {
        if (form.id.value) {
          await api('/api/vehicles/' + form.id.value, { method: 'PUT', body: JSON.stringify(body) });
        } else {
          await api('/api/vehicles', { method: 'POST', body: JSON.stringify(body) });
        }
        msg.innerHTML = '<div class="alert alert-success">Saved.</div>';
        resetForm();
        load();
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });

    listEl.addEventListener('click', async (e) => {
      const del = e.target.dataset.del;
      const edit = e.target.dataset.edit;
      if (del) {
        if (!confirm('Delete this vehicle?')) return;
        try {
          await api('/api/vehicles/' + del, { method: 'DELETE' });
          load();
        } catch (err) { alert(err.message); }
      } else if (edit) {
        const v = JSON.parse(edit);
        form.id.value = v.id;
        form.make_model.value = v.make_model;
        form.year.value = v.year ?? '';
        form.reg_number.value = v.reg_number;
        form.color
