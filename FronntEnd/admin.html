<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — AutoClean360</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <main class="container">
    <h2>Admin Dashboard</h2>
    <div id="stats" class="grid"></div>

    <h3 class="mt-2">All Bookings</h3>
    <div id="bookings"></div>

    <h3 class="mt-2">All Users</h3>
    <div id="users"></div>
  </main>
  <footer><p>&copy; 2026 AutoClean360</p></footer>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    requireAdmin();

    const statsEl = document.getElementById('stats');
    const bookingsEl = document.getElementById('bookings');
    const usersEl = document.getElementById('users');

    async function loadStats() {
      const s = await api('/api/admin/stats');
      statsEl.innerHTML = `
        <div class="card"><h3>${s.users}</h3><p class="muted">Users</p></div>
        <div class="card"><h3>${s.bookings}</h3><p class="muted">Bookings</p></div>
        <div class="card"><h3>${s.pending}</h3><p class="muted">Pending</p></div>
        <div class="card"><h3>R${Number(s.revenue).toFixed(2)}</h3><p class="muted">Revenue</p></div>
        <div class="card"><h3>${s.vehicles}</h3><p class="muted">Vehicles</p></div>`;
    }

    async function loadBookings() {
      const rows = await api('/api/admin/bookings');
      bookingsEl.innerHTML = `<table>
        <thead><tr><th>Date</th><th>User</th><th>Vehicle</th><th>Service</th><th>Status</th><th>Update</th></tr></thead>
        <tbody>${rows.map(b => `
          <tr>
            <td>${b.booking_date?.slice(0,10)} ${b.booking_time}</td>
            <td>${b.user.name}<br><span class="muted">${b.user.email}</span></td>
            <td>${b.vehicle.make_model} (${b.vehicle.reg_number})</td>
            <td>${b.service.name}</td>
            <td><span class="pill pill-${b.status}">${b.status}</span></td>
            <td>
              <select data-id="${b.id}" class="status-sel">
                ${['pending','confirmed','completed','cancelled'].map(s =>
                  `<option value="${s}" ${s === b.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('')}
        </tbody></table>`;
    }

    async function loadUsers() {
      const rows = await api('/api/admin/users');
      usersEl.innerHTML = `<table>
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Admin</th><th>Joined</th></tr></thead>
        <tbody>${rows.map(u => `
          <tr>
            <td>${u.id}</td><td>${u.name}</td><td>${u.email}</td>
            <td>${u.phone || '—'}</td>
            <td>${u.is_admin ? '✅' : ''}</td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
          </tr>`).join('')}
        </tbody></table>`;
    }

    bookingsEl.addEventListener('change', async (e) => {
      if (!e.target.matches('.status-sel')) return;
      try {
        await api('/api/admin/bookings/' + e.target.dataset.id, {
          method: 'PATCH',
          body: JSON.stringify({ status: e.target.value }),
        });
      } catch (err) { alert(err.message); }
    });

    (async () => {
      try {
        await loadStats();
        await loadBookings();
        await loadUsers();
      } catch (err) {
        document.querySelector('main').innerHTML =
          `<div class="alert alert-error">${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
